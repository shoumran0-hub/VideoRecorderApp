workflows:
  android-workflow:
    name: Android Workflow
    instance_type: linux
    max_build_duration: 60
    environment:
      java: 11
      ndk: 21.4.7075529
      android_sdk: 30
    triggering:
      events:
        - push
      branch:
        - main
    scripts:
      - name: Set up local properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build APK
        script: |
          ./gradlew assembleRelease
    artifacts:
      - build/outputs/apk/**/*.apk
    publishing:
      slack:
        channel: '#build-status'
        notify_on_build_start: true
        notify:
          success: true
          failure: true
